# Per-repo values for the shared ../devtools scripts (see
# ../devtools/templates/devtools.conf.sample for every key).
APP_NAME=duocb
PROJECT_NAME=Duocb
SCHEME=DuocbApp
PRODUCT_NAME=duocb
# BUNDLE_ID intentionally unset: it is a per-developer xcconfig value
# (DUOCB_BUNDLE_IDENTIFIER); run-device reads it from the built app.

CORE_REPO=duocb
CORE_GH_REPO=andrewtheguy/duocb
CORE_BUILD_CMD="./build-ios.sh release"

XCFW_ASSET=libduocb-ios.xcframework.zip
XCFW_PACKAGE_PATH=Packages/Duocb
LOCAL_XCFW_ENV=DUOCB_LOCAL_XCFRAMEWORK

# The app version (MARKETING_VERSION) moves independently of the core; a bump
# only rewrites the pinned core version project.yml surfaces in the footer.
BUMP_VERSION_MODE=core-key
CORE_VERSION_KEY=DUOCB_CORE_VERSION
BUMP_REGENERATE=1

OTA_APP_TITLE=Duocb

# ci/ci.sh's default set includes `device`, which signs — codesign over plain
# ssh can hit a locked login keychain, so mac-ci runs the signing-free set.
MAC_CI_DEFAULT_JOBS="simulator smoke unsigned"
